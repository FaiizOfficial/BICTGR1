<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - Inventory Control</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset & Style Dasar */
        body {
            margin: 0;
            padding: 20px 0; 
            background-color: #e9ecef; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        /* Container utama ala HP */
        .app-container {
            background-color: #f8f9fa; 
            width: 100%;
            max-width: 420px;
            height: auto; 
            min-height: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            border: 8px solid #333; 
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            padding-bottom: 30px; 
        }

        /* Responsive untuk HP beneran */
        @media (max-width: 480px) {
            .app-container {
                border: none;
                border-radius: 0;
                min-height: 100vh;
                box-shadow: none;
                padding-bottom: 50px;
            }
            body { background-color: #f8f9fa; padding: 0; }
        }

        /* Header Melengkung Khas Biru Indomaret */
        .app-header {
            background: linear-gradient(135deg, #005b9f, #003e6d);
            width: 100%;
            padding: 40px 20px 50px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 5px 15px rgba(0, 91, 159, 0.4);
            box-sizing: border-box;
        }

        /* Logo Indomaret */
        .logo-img {
            max-width: 150px;
            background-color: white;
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .app-header h1 {
            color: white;
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .app-header p {
            color: #ffd600; 
            margin: 5px 0 0 0;
            font-size: 14px;
            font-weight: 600;
        }

        /* Container Konten Views (Ganti-ganti halaman) */
        .view-section {
            width: 85%;
            margin-top: 30px;
            display: none; /* Disembunyikan default */
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }

        /* Class untuk halaman yang aktif */
        .view-active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Teks Instruksi */
        .instruction-text {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            font-weight: 600;
            font-style: italic;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Style Grid untuk Menu Kotak (Point I) */
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        /* Style dasar tombol Card */
        .btn-card {
            display: flex;
            align-items: center;
            text-decoration: none;
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid #eaeaea;
            cursor: pointer;
            border: none;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .btn-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-card:active {
            transform: scale(0.97);
        }

        /* Modifier untuk tombol Kotak (Point I) */
        .btn-square {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            padding: 30px 15px;
            aspect-ratio: 1 / 1;
        }
        .btn-square .btn-icon {
            margin-right: 0;
            margin-bottom: 15px;
            font-size: 40px;
        }
        .btn-square .btn-text {
            text-align: center;
        }
        .btn-square::before {
            width: 100%;
            height: 6px;
            bottom: auto; /* Garis di atas untuk kotak */
        }

        /* Ikon di dalam tombol */
        .btn-icon {
            font-size: 30px;
            margin-right: 20px;
            width: 40px;
            text-align: center;
        }

        /* Teks di dalam tombol */
        .btn-text {
            color: #2b2b2b;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Variasi Warna Tombol */
        .btn-blue .btn-icon { color: #005b9f; }
        .btn-blue::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #005b9f; }
        .btn-square.btn-blue::before { width: 100%; height: 6px; }

        .btn-yellow .btn-icon { color: #e51d20; }
        .btn-yellow::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #ffd600; }
        .btn-square.btn-yellow::before { width: 100%; height: 6px; }

        .btn-green .btn-icon { color: #0f9d58; }
        .btn-green::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #0f9d58; }

        .btn-orange .btn-icon { color: #f39c12; }
        .btn-orange::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #f39c12; }

        .btn-teal .btn-icon { color: #17a2b8; }
        .btn-teal::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #17a2b8; }

        .btn-purple .btn-icon { color: #6f42c1; }
        .btn-purple::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background-color: #6f42c1; }

        /* Label Badge Baru di Tombol */
        .badge-new {
            background-color: #e51d20;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Tombol Back to Menu */
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #343a40;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s;
        }
        .btn-back:hover { background-color: #23272b; }
        .btn-back i { margin-right: 10px; }

    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9d/Logo_Indomaret.png" alt="Logo Indomaret" class="logo-img">
            <h1>INVENTORY CONTROL</h1>
            <p>TANGERANG 1</p>
        </header>

        <div id="view-main" class="view-section view-active">
            <p class="instruction-text">Select The Menu</p>
            
            <div class="grid-menu">
                <button onclick="switchView('view-sokas')" class="btn-card btn-square btn-blue">
                    <i class="fa-solid fa-clipboard-check btn-icon"></i>
                    <div class="btn-text">LAPORAN<br>SO KAS</div>
                </button>

                <button onclick="switchView('view-foto')" class="btn-card btn-square btn-yellow">
                    <i class="fa-solid fa-camera-retro btn-icon"></i>
                    <div class="btn-text">LAPORAN<br>SO FOTO</div>
                </button>
            </div>
        </div>

        <div id="view-sokas" class="view-section">
            <p class="instruction-text">Menu SO KAS</p>

            <a href="laporan-so.html" class="btn-card btn-blue">
                <i class="fa-solid fa-clipboard-check btn-icon"></i>
                <div class="btn-text">INPUT LAPORAN<br>SO & KAS HARIAN</div>
            </a>

            <a href="monitoring.html" class="btn-card btn-teal">
                <i class="fa-solid fa-desktop btn-icon"></i>
                <div class="btn-text">
                    MONITORING SO KAS<br>
                    <span style="font-size: 12px; color: #6c757d; font-weight: 500;">Pantau Laporan SO Masuk</span>
                </div>
            </a>

            <a href="https://docs.google.com/spreadsheets/d/1--15lTnPMyNCLs7S2svKHWqvjzzfl5FavUs5lLoi88w/edit?usp=drivesdk" target="_blank" class="btn-card btn-green">
                <i class="fa-solid fa-file-excel btn-icon"></i>
                <div class="btn-text">CEK SPREADSHEET SO</div>
            </a>

            <button onclick="switchView('view-main')" class="btn-back">
                <i class="fa-solid fa-arrow-rotate-left"></i> BACK TO MENU
            </button>
        </div>

        <div id="view-foto" class="view-section">
            <p class="instruction-text">Menu Laporan Foto</p>

            <a href="laporan-foto.html" class="btn-card btn-yellow">
                <i class="fa-solid fa-images btn-icon"></i>
                <div class="btn-text">INPUT LAPORAN FOTO<br>B/A & BRANKAS</div>
            </a>

            <a href="monitoring_foto.html" class="btn-card btn-purple">
                <span class="badge-new">NEW</span>
                <i class="fa-solid fa-camera-retro btn-icon"></i>
                <div class="btn-text">
                    MONITORING FOTO<br>
                    <span style="font-size: 12px; color: #6c757d; font-weight: 500;">Pantau Laporan B/A</span>
                </div>
            </a>

            <a href="https://docs.google.com/spreadsheets/d/1YDn5DhDLdRDHDvWhqrLtwN5nB3fswonvFV59c874uI0/edit?usp=sharing" target="_blank" class="btn-card btn-orange">
                <i class="fa-solid fa-file-image btn-icon"></i>
                <div class="btn-text">CEK SPREADSHEET B/A</div>
            </a>

            <button onclick="switchView('view-main')" class="btn-back">
                <i class="fa-solid fa-arrow-rotate-left"></i> BACK TO MENU
            </button>
        </div>

    </div>

    <script>
        function switchView(targetId) {
            // Sembunyikan semua section
            document.querySelectorAll('.view-section').forEach(function(el) {
                el.classList.remove('view-active');
            });
            // Tampilkan section yang dipilih
            document.getElementById(targetId).classList.add('view-active');
        }
    </script>

</body>
</html>
